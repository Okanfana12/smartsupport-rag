# =============================================================
# SmartSupport RAG — Configuration centrale
# Tous les paramètres techniques du projet
# =============================================================

# -------------------------------------------------------------
# LLM — Choix des modèles selon la tâche
# -------------------------------------------------------------
llm:
  # LLM principal — RAG sur documents longs
  # claude-3-5-sonnet-20240620 : version stable et disponible
  rag:
    provider: anthropic
    model: claude-3-5-sonnet-20240620
    temperature: 0.1
    max_tokens: 2048

  # LLM rapide — Questions simples et courtes
  # Claude 3 Haiku : 3x moins cher, 2x plus rapide
  fast:
    provider: anthropic
    model: claude-3-haiku-20240307
    temperature: 0.1
    max_tokens: 1024

  # LLM évaluation — Juge la qualité des réponses
  # GPT-4o : meilleur raisonnement pour le scoring RAGAS
  evaluation:
    provider: openai
    model: gpt-4o
    temperature: 0.0
    max_tokens: 2048

  # LLM souverain — Données confidentielles
  # Mistral local : aucune donnée ne quitte l'infrastructure
  sovereign:
    provider: ollama
    model: mistral
    temperature: 0.1
    max_tokens: 2048

# -------------------------------------------------------------
# Embeddings — Vectorisation des documents et questions
# -------------------------------------------------------------
embeddings:
  # text-embedding-3-small : meilleur rapport qualité/coût OpenAI
  # 1536 dimensions, 62% moins cher que ada-002
  provider: openai
  model: text-embedding-3-small
  dimensions: 1536

# -------------------------------------------------------------
# Chunking — Découpage adaptatif par type de document
#
# Règle des séparateurs :
#   Documents avec paragraphes (PDF, DOCX, HTML, TXT, EML, PPTX)
#     → ["\n\n", "\n", ". ", " ", ""]
#     Priorité : paragraphe > ligne > phrase > mot > caractère
#
#   Documents tabulaires (CSV)
#     → ["\n", ",", " ", ""]
#     Priorité : ligne > champ > mot
#
#   Documents structurés (JSON)
#     → ["\n\n", "\n", " ", ""]
#     Priorité : bloc > ligne > mot
# -------------------------------------------------------------
chunking:
  # PDF — documents techniques denses
  pdf:
    chunk_size: 300
    chunk_overlap: 60
    separators: ["\n\n", "\n", ". ", " ", ""]

  # DOCX — rapports structurés par paragraphes
  docx:
    chunk_size: 300
    chunk_overlap: 60
    separators: ["\n\n", "\n", ". ", " ", ""]

  # CSV — données tabulaires (1 ligne = 1 ticket)
  csv:
    chunk_size: 300
    chunk_overlap: 50
    separators: ["\n", ",", " ", ""]

  # JSON — données structurées (clés/valeurs)
  json:
    chunk_size: 300
    chunk_overlap: 60
    separators: ["\n\n", "\n", " ", ""]

  # HTML — contenu web (procédures, documentation)
  html:
    chunk_size: 300
    chunk_overlap: 60
    separators: ["\n\n", "\n", ". ", " ", ""]

  # Email — échanges support
  email:
    chunk_size: 400
    chunk_overlap: 80
    separators: ["\n\n", "\n", ". ", " ", ""]

  # TXT — texte brut
  txt:
    chunk_size: 300
    chunk_overlap: 60
    separators: ["\n\n", "\n", ". ", " ", ""]

  # PPTX — présentations
  pptx:
    chunk_size: 300
    chunk_overlap: 60
    separators: ["\n\n", "\n", ". ", " ", ""]

  # Valeurs par défaut
  default:
    chunk_size: 300
    chunk_overlap: 60
    separators: ["\n\n", "\n", ". ", " ", ""]

# -------------------------------------------------------------
# Vector Store — Stockage et recherche des vecteurs
# -------------------------------------------------------------
vector_store:
  type: chroma

  chroma:
    collection_name: smartsupport_docs
    persist_directory: ./data/chroma_db

  faiss:
    index_path: ./data/faiss_index

# -------------------------------------------------------------
# RAG — Paramètres de retrieval et génération
# -------------------------------------------------------------
rag:
  top_k: 4
  confidence_threshold: 0.75
  confidence_warning: 0.50

  system_prompt: |
    Tu es un assistant support client expert pour TechVision SAS.
    Tu réponds aux questions des agents support en te basant
    UNIQUEMENT sur les documents fournis en contexte.

    Règles strictes :
    - Cite toujours tes sources (nom du fichier, numéro de page si disponible)
    - Si l'information n'est pas dans le contexte, dis-le explicitement
    - Ne jamais inventer ou extrapoler des informations
    - Utilise un langage clair et professionnel
    - Structure ta réponse avec des étapes numérotées si c'est une procédure

# -------------------------------------------------------------
# Évaluation RAGAS — Métriques de qualité
# -------------------------------------------------------------
evaluation:
  metrics:
    - faithfulness
    - answer_relevancy
    - context_precision
    - context_recall

  thresholds:
    faithfulness: 0.80
    answer_relevancy: 0.75
    context_precision: 0.70
    context_recall: 0.70

  judge_llm: gpt-4o

# -------------------------------------------------------------
# Logging — Traçabilité et débogage
# -------------------------------------------------------------
logging:
  level: INFO
  format: json
  file: ./logs/app.log