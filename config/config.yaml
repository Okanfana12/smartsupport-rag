# =============================================================
# SmartSupport RAG — Configuration centrale
# Tous les paramètres techniques du projet
# =============================================================

# -------------------------------------------------------------
# LLM — Choix des modèles selon la tâche
# -------------------------------------------------------------
llm:
  # LLM principal — RAG sur documents longs
  # Claude 3 Sonnet : 200K tokens contexte, excellent sur texte technique
  rag:
    provider: anthropic
    model: claude-3-5-sonnet-20241022
    temperature: 0.1
    max_tokens: 2048

  # LLM rapide — Questions simples et courtes
  # Claude 3 Haiku : 3x moins cher, 2x plus rapide que Sonnet
  fast:
    provider: anthropic
    model: claude-3-haiku-20240307
    temperature: 0.1
    max_tokens: 1024

  # LLM évaluation — Juge la qualité des réponses
  # GPT-4o : meilleur raisonnement pour le scoring RAGAS
  evaluation:
    provider: openai
    model: gpt-4o
    temperature: 0.0
    max_tokens: 2048

  # LLM souverain — Données confidentielles
  # Mistral local : aucune donnée ne quitte l'infrastructure
  sovereign:
    provider: ollama
    model: mistral
    temperature: 0.1
    max_tokens: 2048

# -------------------------------------------------------------
# Embeddings — Vectorisation des documents et questions
# -------------------------------------------------------------
embeddings:
  # text-embedding-3-small : meilleur rapport qualité/coût OpenAI
  # 1536 dimensions, 62% moins cher que ada-002
  provider: openai
  model: text-embedding-3-small
  dimensions: 1536

# -------------------------------------------------------------
# Chunking — Découpage adaptatif par type de document
#
# Règle des séparateurs :
#   Documents avec paragraphes (PDF, DOCX, HTML, TXT, EML, PPTX)
#     → ["\n\n", "\n", ". ", " ", ""]
#     Priorité : paragraphe > ligne > phrase > mot > caractère
#
#   Documents tabulaires (CSV)
#     → ["\n", ",", " ", ""]
#     Priorité : ligne > champ > mot
#     Pas de \n\n car pas de paragraphes dans un CSV
#
#   Documents structurés (JSON)
#     → ["\n\n", "\n", " ", ""]
#     Priorité : bloc > ligne > mot
#     Pas de ". " car le JSON n'a pas de phrases
#
# Règle chunk_size :
#   Après analyse des documents réels :
#   PDF  → 8 pages, ~380 chars/page → chunk_size 300 = ~1 chunk/page ✅
#   DOCX → 1 doc, ~12000 chars      → chunk_size 300 = ~12 chunks    ✅
#   CSV  → 1 ligne = ~165 tokens    → chunk_size 300 = 1 chunk/ligne  ✅
#   EML  → 1 doc, ~7400 chars       → chunk_size 400 = ~5 chunks      ✅
# -------------------------------------------------------------
chunking:
  # PDF — documents techniques denses (FAQ, rapports)
  # Séparateurs : paragraphe > ligne > phrase > mot
  pdf:
    chunk_size: 300
    chunk_overlap: 60
    separators: ["\n\n", "\n", ". ", " ", ""]

  # DOCX — rapports structurés par paragraphes
  # Séparateurs : paragraphe > ligne > phrase > mot
  docx:
    chunk_size: 300
    chunk_overlap: 60
    separators: ["\n\n", "\n", ". ", " ", ""]

  # CSV — données tabulaires (1 ligne = 1 ticket)
  # Séparateurs : ligne > champ CSV > mot
  # Pas de \n\n (pas de paragraphes) ni ". " (pas de phrases)
  csv:
    chunk_size: 300
    chunk_overlap: 50
    separators: ["\n", ",", " ", ""]

  # JSON — données structurées (clés/valeurs)
  # Séparateurs : bloc > ligne > mot
  # Pas de ". " (le JSON n'a pas de phrases naturelles)
  json:
    chunk_size: 300
    chunk_overlap: 60
    separators: ["\n\n", "\n", " ", ""]

  # HTML — contenu web (procédures, documentation)
  # Après nettoyage BSHTMLLoader = texte structuré avec paragraphes
  # Séparateurs : paragraphe > ligne > phrase > mot
  html:
    chunk_size: 300
    chunk_overlap: 60
    separators: ["\n\n", "\n", ". ", " ", ""]

  # Email — échanges support (messages courts)
  # chunk_size plus grand car 1 échange = ~600 chars
  # Séparateurs : échange > ligne > phrase > mot
  email:
    chunk_size: 400
    chunk_overlap: 80
    separators: ["\n\n", "\n", ". ", " ", ""]

  # TXT — texte brut (notes internes, logs)
  # Séparateurs : paragraphe > ligne > phrase > mot
  txt:
    chunk_size: 300
    chunk_overlap: 60
    separators: ["\n\n", "\n", ". ", " ", ""]

  # PPTX — présentations (1 slide = 1 document)
  # Slides courtes et indépendantes
  # Séparateurs : paragraphe > ligne > phrase > mot
  pptx:
    chunk_size: 300
    chunk_overlap: 60
    separators: ["\n\n", "\n", ". ", " ", ""]

  # Valeurs par défaut si type non reconnu
  default:
    chunk_size: 300
    chunk_overlap: 60
    separators: ["\n\n", "\n", ". ", " ", ""]

# -------------------------------------------------------------
# Vector Store — Stockage et recherche des vecteurs
# -------------------------------------------------------------
vector_store:
  # "chroma" pour la production (persistance automatique)
  # "faiss" pour le développement (simple, sans installation)
  type: chroma

  chroma:
    collection_name: smartsupport_docs
    persist_directory: ./data/chroma_db

  faiss:
    index_path: ./data/faiss_index

# -------------------------------------------------------------
# RAG — Paramètres de retrieval et génération
# -------------------------------------------------------------
rag:
  # Nombre de chunks retournés par la recherche vectorielle
  top_k: 4

  # Seuil de confiance — entre 0.0 et 1.0
  # En dessous : fallback déclenché
  confidence_threshold: 0.75

  # Seuil d'avertissement — réponse avec warning
  confidence_warning: 0.50

  # Prompt système RAG
  system_prompt: |
    Tu es un assistant support client expert pour TechVision SAS.
    Tu réponds aux questions des agents support en te basant
    UNIQUEMENT sur les documents fournis en contexte.

    Règles strictes :
    - Cite toujours tes sources (nom du fichier, numéro de page si disponible)
    - Si l'information n'est pas dans le contexte, dis-le explicitement
    - Ne jamais inventer ou extrapoler des informations
    - Utilise un langage clair et professionnel
    - Structure ta réponse avec des étapes numérotées si c'est une procédure

# -------------------------------------------------------------
# Évaluation RAGAS — Métriques de qualité
# -------------------------------------------------------------
evaluation:
  metrics:
    - faithfulness
    - answer_relevancy
    - context_precision
    - context_recall

  thresholds:
    faithfulness: 0.80
    answer_relevancy: 0.75
    context_precision: 0.70
    context_recall: 0.70

  judge_llm: gpt-4o

# -------------------------------------------------------------
# Logging — Traçabilité et débogage
# -------------------------------------------------------------
logging:
  level: INFO
  format: json
  file: ./logs/app.log