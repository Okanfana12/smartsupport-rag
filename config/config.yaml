# ============================================================
# CELLULE ANALYSE — Tailles des documents avec config.yaml
# ============================================================
import yaml
import os
from src.ingestion.loader import load_file

# Lecture des paramètres depuis config.yaml
with open('config/config.yaml', 'r') as f:
    config = yaml.safe_load(f)

files = [
    ('pdf',   'data/pdf_files/FAQ_Support_Client_v3.2.txt'),
    ('word',  'data/word_files/Manuel_Utilisateur_TechVision_v4.2.txt'),
    ('csv',   'data/csv_files/historique_tickets_2026.csv'),
    ('json',  'data/json_files/base_connaissances_techvision.json'),
    ('html',  'data/html_files/procedures_support_internes.html'),
    ('email', 'data/email_files/echanges_support_janvier_2026.txt'),
]

# Mapping source → clé config.yaml
type_map = {
    'pdf': 'pdf', 'word': 'docx',
    'csv': 'csv', 'json': 'json',
    'html': 'html', 'email': 'email'
}

print("=== ANALYSE DES TAILLES DE DOCUMENTS ===\n")
print(f"{'Source':<10} {'Fichier':<45} {'Chars':>10} {'Tokens':>10} {'Chunks':>10}")
print("-" * 90)

total_chunks = 0

for source, path in files:
    docs = load_file(path)

    # Lecture chunk_size depuis config.yaml
    cfg_key = type_map[source]
    chunk_size = config['chunking'][cfg_key]['chunk_size']
    overlap = config['chunking'][cfg_key]['chunk_overlap']

    for doc in docs:
        chars  = len(doc.page_content)
        tokens = chars // 4
        chunks = max(1, (tokens - overlap) // (chunk_size - overlap))
        filename = os.path.basename(path)[:43]
        print(f"{source:<10} {filename:<45} {chars:>10,} {tokens:>10,} {chunks:>10,}")
        total_chunks += chunks

print("-" * 90)
print(f"\nTotal chunks estimés : {total_chunks}")
print(f"\nParamètres utilisés :")
for key in ['pdf', 'docx', 'csv', 'json', 'html', 'email']:
    cs = config['chunking'][key]['chunk_size']
    co = config['chunking'][key]['chunk_overlap']
    print(f"  {key:<8} chunk_size={cs}, overlap={co}")